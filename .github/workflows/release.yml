name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            label: darwin-arm64
          - os: macos-15-intel
            arch: amd64
            label: darwin-amd64
          - os: ubuntu-22.04
            arch: amd64
            label: linux-amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install nuitka ordered-set zstandard

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "from swm import __version__; print(__version__)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --deployment \
            --output-filename=swm \
            --output-dir=dist \
            --include-package=swm \
            --include-package=click \
            --include-package=rich \
            --include-package=tomli_w \
            --include-package=httpx \
            --include-package=boto3 \
            --include-package=botocore \
            --include-package=certifi \
            --include-package=httpcore \
            --include-package=idna \
            --include-package=anyio \
            --include-package=h11 \
            --include-package=urllib3 \
            --include-package=jmespath \
            --include-package=dateutil \
            --include-package=s3transfer \
            --follow-imports \
            --assume-yes-for-downloads \
            --remove-output \
            swm_main.py

      - name: Package binary
        run: |
          ARTIFACT="swm-${{ steps.version.outputs.version }}-${{ matrix.label }}"
          mv dist/swm "dist/${ARTIFACT}"
          cd dist
          shasum -a 256 "${ARTIFACT}" > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.ARTIFACT }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/swm-*

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    name: Update Homebrew tap

    steps:
      - name: Compute version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts (sha256 files)
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract sha256 hashes
        id: sha
        run: |
          V="${{ steps.v.outputs.version }}"
          echo "arm64=$(awk '{print $1}' artifacts/swm-${V}-darwin-arm64.sha256)" >> "$GITHUB_OUTPUT"
          echo "amd64=$(awk '{print $1}' artifacts/swm-${V}-darwin-amd64.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux=$(awk '{print $1}' artifacts/swm-${V}-linux-amd64.sha256)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: swm-gpu/homebrew-swm
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        run: |
          V="${{ steps.v.outputs.version }}"
          cat > tap/Formula/swm.rb <<EOF
          class Swm < Formula
            desc "One CLI to search, provision, and manage cloud GPUs across 10 providers"
            homepage "https://github.com/swm-gpu/swm"
            version "${V}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/swm-gpu/swm/releases/download/v#{version}/swm-#{version}-darwin-arm64"
                sha256 "${{ steps.sha.outputs.arm64 }}"
              end
              on_intel do
                url "https://github.com/swm-gpu/swm/releases/download/v#{version}/swm-#{version}-darwin-amd64"
                sha256 "${{ steps.sha.outputs.amd64 }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/swm-gpu/swm/releases/download/v#{version}/swm-#{version}-linux-amd64"
                sha256 "${{ steps.sha.outputs.linux }}"
              end
            end

            def install
              binary = Dir["swm-*"].first || "swm"
              bin.install binary => "swm"
              chmod 0555, bin/"swm"
              generate_completions_from_executable(bin/"swm", shells: [:bash, :zsh, :fish], shell_parameter_format: :click)
            end

            test do
              assert_match "swm, version", shell_output("#{bin}/swm --version")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/swm.rb; then
            echo "Formula already up to date"
            exit 0
          fi
          git add Formula/swm.rb
          git commit -m "Update formula to v${{ steps.v.outputs.version }}"
          git push

  pypi:
    needs: release
    runs-on: ubuntu-latest
    name: Publish to PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/swm-gpu/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version drift (tag vs pyproject vs __version__)
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re,sys; m=re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', open('src/swm/__init__.py').read()); print(m.group(1) if m else sys.exit('no __version__ in src/swm/__init__.py'))")
          TOML=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  __version__=$PKG  pyproject=$TOML"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TOML" ]; then
            echo "::error::version drift detected (tag=$TAG, __version__=$PKG, pyproject=$TOML)"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

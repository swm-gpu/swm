[project]
name = "swm"
version = "0.1.0"
description = "Cloud GPU workflow manager for ComfyUI / SwarmUI video generation"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli_w>=1.0",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
coreweave = ["kubernetes>=29.0"]
b2 = ["b2>=4.0"]
dev = ["nuitka", "ordered-set", "zstandard"]
all = ["kubernetes>=29.0", "b2>=4.0"]

[project.scripts]
swm = "swm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swm"]

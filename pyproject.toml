[project]
name = "swm-gpu"
version = "0.2.8"
description = "One CLI to search, provision, and manage cloud GPUs across 10 providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["gpu", "cloud", "cli", "runpod", "vastai", "lambda", "aws", "gcp", "azure", "coreweave"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli_w>=1.0",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
coreweave = ["kubernetes>=29.0"]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-resource>=23.0",
]
dev = ["nuitka", "ordered-set", "zstandard"]
all = ["kubernetes>=29.0", "azure-identity>=1.15", "azure-mgmt-compute>=30.0", "azure-mgmt-network>=25.0", "azure-mgmt-resource>=23.0"]

[project.urls]
Homepage = "https://swmgpu.com"
Repository = "https://github.com/swm-gpu/swm"
Documentation = "https://swmgpu.com/overview/"
Issues = "https://github.com/swm-gpu/swm/issues"

[project.scripts]
swm = "swm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["site/", "dist/", "docs/", ".github/", "Formula/", "*.build/", "*.dist/", "*.onefile-build/"]

[tool.hatch.build.targets.wheel]
packages = ["src/swm"]
